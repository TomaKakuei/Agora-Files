<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成世界设计比较 · World Design Study</title>
<style>
:root{--ink:#202f38;--muted:#62727a;--teal:#087f83;--line:#d8e2e1;--paper:#fff;--bg:#f4f6f2;--gold:#b8852d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}header{border-bottom:1px solid var(--line);background:#fff;padding:16px max(20px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{letter-spacing:.05em;color:var(--teal)}main{max-width:1180px;margin:32px auto;padding:0 20px 72px}h1{font-size:32px;line-height:1.3;margin:0 0 18px}h2{font-size:22px;line-height:1.4;margin:0 0 12px}h3{font-size:14px;letter-spacing:.04em;color:var(--teal);margin:20px 0 6px}p{margin:10px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:20px}.intro{max-width:820px;margin:auto}.muted{color:var(--muted);font-size:14px}.kicker{font-size:13px;color:var(--teal);font-weight:700;letter-spacing:.08em;margin-bottom:10px}.notice{border-left:3px solid var(--gold);padding:10px 16px;background:#fbf7ed}.choices{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.choice{border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:6px;padding:10px 8px;font-size:13px;cursor:pointer}.choice:has(input:checked){border-color:var(--teal);background:#e9f6f3}.choice input{accent-color:var(--teal);margin:0}.question{padding:20px 0;border-top:1px solid var(--line)}.question:first-child{border:0}.question p{font-weight:600;margin:0 0 10px}.duel{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.evidence{font:14px/1.6 Georgia,"Times New Roman",serif;margin:0;padding-left:18px}.evidence li{margin:5px 0}.world .label{font-size:24px;font-weight:750;color:var(--teal);border-bottom:2px solid var(--gold);padding-bottom:10px}.world{min-width:0}.prompt{white-space:pre-line;font-family:Georgia,"Times New Roman",serif;font-size:16px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar .spacer{flex:1}button{background:var(--teal);border:0;border-radius:8px;padding:12px 20px;color:#fff;font:600 15px system-ui;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:default}input[type=text],select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:10px;max-width:100%;background:#fff;color:var(--ink)}textarea{width:100%;min-height:85px}label.block{display:block;margin:14px 0}label.block input{margin-right:8px;accent-color:var(--teal)}.error{color:#a33832;font-weight:600}.progress{height:5px;background:#dbe9e6;border-radius:4px;margin:14px 0 24px}.progress span{display:block;height:100%;background:var(--teal);border-radius:4px}.hidden{display:none}.pill{font-size:12px;background:#e8f2ef;color:var(--teal);padding:4px 10px;border-radius:20px}.footer{font-size:12px;color:var(--muted);margin-top:28px}a{color:var(--teal)}@media(max-width:760px){main{margin:18px auto;padding:0 12px 40px}.card{padding:18px}.duel{grid-template-columns:1fr;gap:0}.choices{grid-template-columns:repeat(3,1fr)}h1{font-size:26px}header{padding:12px;align-items:flex-start}.world .label{position:static}}@media print{header,.toolbar,.noprint{display:none!important}body{background:white;font-size:11px}main{margin:0;padding:0}.card{border-radius:0;break-inside:avoid;padding:12px}.duel{grid-template-columns:1fr 1fr;gap:12px}.evidence{font-size:10px}.choices{grid-template-columns:repeat(6,1fr)}h1{font-size:22px}}
</style>
<header><strong>WORLD DESIGN STUDY</strong><div class="toolbar"><select id="language" aria-label="Interface language"><option value="zh">中文说明</option><option value="en">English instructions</option></select><span class="pill">2026.09 · v2</span></div></header>
<main id="app"></main>
<script id="study-data" type="application/json">__STUDY_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('study-data').textContent);
const app=document.getElementById('app');let lang='zh',state=null,index=-1,enteredAt=0;
const T=(zh,en)=>lang==='zh'?zh:en;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QUESTIONS=[
 ['overall','总体世界设计','Overall world design','综合所示材料，哪一份世界设计更好？','Considering the supplied evidence, which world design is better?'],
 ['premise','设定实现','Premise realization','哪一份更充分地把共同生成要求发展成具体世界？','Which better develops the common request into a specific world?'],
 ['coherence','规则与活动的联系','Rules and activities','哪一份更清楚地展示规则如何影响活动和冲突？','Which more clearly connects rules to activities and conflicts?'],
 ['society','人物与社会联系','People and social connections','哪一份更清楚地展示不同人物的目标如何相互关联？','Which more clearly connects the goals of different characters?'],
 ['specificity','地点与物件','Places and objects','哪一份的地点和物件更能体现这个世界的独特设定？','Which has places and objects more specific to this world?'],
 ['actions','可设想的行动','Possible actions','哪一份更能让你设想会影响世界的具体行动？','Which better suggests concrete actions that could affect the world?']
];
const OPTIONS=[['A_much','A 明显更好','A much better'],['A_slight','A 略好','A slightly better'],['tie','两者相当','About equal'],['B_slight','B 略好','B slightly better'],['B_much','B 明显更好','B much better'],['unable','材料不足，无法判断','Insufficient evidence']];
function persist(){if(state){try{localStorage.setItem(DATA.version+'-'+state.assignment_code,JSON.stringify(state));}catch(e){}}}
function elapsed(){if(index>=0&&index<4&&enteredAt&&state){state.responses[index].active_seconds+=(Date.now()-enteredAt)/1000;enteredAt=Date.now();persist();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){elapsed();enteredAt=0;}else if(index>=0&&index<4){enteredAt=Date.now();}});
function intro(){index=-1;app.innerHTML=`<div class="intro"><div class="kicker">${T('参与者说明','PARTICIPANT INFORMATION')}</div><h1>${T('比较两份生成世界设计','Compare two generated world designs')}</h1><div class="card"><p>${T('你将阅读 4 组材料。每组的 A、B 两份设计依据同一生成要求产生，请按材料本身作出判断。来源名称已隐藏，A/B 位置会变化，没有预设的正确赢家。','You will review four pairs. Within each pair, A and B were generated from the same request. Judge the supplied evidence. Source names are hidden, positions vary, and there is no predetermined correct winner.')}</p><p>${T('说明和问题可切换中英文；世界材料保留英文原文。请仅在能够独立阅读英文材料时参与。请勿使用翻译模型或让其他人代评。','Instructions and questions are bilingual; world evidence remains in its original English. Participate only if you can read it independently. Please do not use translation models or ask others to supply judgments.')}</p><p>${T('本研究评价书面世界设计。材料使用统一的字段数量、原始顺序和截取上限；[…] 表示截断。未展示的内容不能据此断言不存在。这里不评价实际运行效果、图像质量或游玩体验。','This study evaluates written world design. Fields use common quotas, source order, and truncation limits; […] marks truncation. Omitted content is not evidence of absence. This study does not evaluate runtime success, image quality, or play experience.')}</p><div class="notice">${T('请预留约 20–30 分钟；这是待试填校准的估计。你可随时退出、跳过无法判断的题目（选择“材料不足”），不会受到惩罚。','Allow approximately 20–30 minutes; this estimate is being checked in the pilot. Participation is voluntary. You may leave at any time or choose “Insufficient evidence” without penalty.')}</div><p>${T('我们记录匿名分配码、阅读经验、各题选择、可选评论和填写时长，用于学术研究的汇总分析及去标识化报告。不要填写姓名、邮箱或其他人的个人信息。任何原话引用都需你在结束时另行同意。','We record an anonymous assignment code, reading experience, choices, optional comments, and elapsed time for aggregate academic analysis and de-identified reporting. Do not enter names, email addresses, or information identifying others. Quoting your comments requires separate consent at the end.')}</p><p>${T('此文件不自动上传数据。草稿保存在当前浏览器；完成后下载答卷，按邀请人的方式交回。交回前可直接删除；交回后如需撤回，请将分配码告知邀请人，汇总公开后可能无法撤回。研究联系人就是向你发送本问卷的邀请人；开始前可向其咨询数据保存和研究安排。','This file does not upload data. A draft is stored in this browser. Download your response and return it as instructed by your recruiter. Before returning it, you can delete it yourself; afterward, request withdrawal through your recruiter using the assignment code. Withdrawal may be impossible after aggregate publication. Contact the person who sent you this study for questions about retention and administration.')}</p></div><form id="start-form" class="card"><label class="block">${T('邀请人分配的编号','Assigned code')} <input id="code" type="text" maxlength="4" placeholder="S001 / P001" required pattern="[SPsp][0-9]{3}" autocomplete="off"></label><p class="muted">${T('编号决定材料与顺序。请使用邀请人给你的唯一编号，不要自行挑选。','Your code determines materials and order. Use the unique code assigned by your recruiter.')}</p><label class="block">${T('文字冒险／角色扮演游戏经验（可不回答）','Text-adventure / role-playing game experience (optional)')} <select id="experience"><option value="undisclosed">${T('不回答','Prefer not to say')}</option><option value="none">${T('没有','None')}</option><option value="occasional">${T('偶尔','Occasional')}</option><option value="frequent">${T('经常','Frequent')}</option></select></label><label class="block">${T('是否参与过本系统的开发或看过其详细结果？','Have you developed this system or seen its detailed results?')} <select id="familiar"><option value="no">${T('没有','No')}</option><option value="yes">${T('有','Yes')}</option><option value="unsure">${T('不确定','Unsure')}</option></select></label><label class="block"><input id="adult" type="checkbox" required>${T('我已年满 18 岁。','I am at least 18 years old.')}</label><label class="block"><input id="english" type="checkbox" required>${T('我能独立阅读英文世界材料。','I can independently read the English evidence.')}</label><label class="block"><input id="consent" type="checkbox" required>${T('我已阅读上述说明，自愿同意以此方式参与研究。','I have read the information and voluntarily agree to participate as described.')}</label><p id="start-error" class="error" role="alert"></p><button type="submit">${T('开始／继续填写','Start / resume')}</button></form><p class="footer">${T('“两者相当”表示你能判断，但没有明显偏好；“材料不足”表示你不能形成判断。不要把文字更长、细节数量更多直接等同于更好。','“About equal” means you can judge but have no clear preference. “Insufficient evidence” means you cannot judge. Greater length or more details do not automatically mean better quality.')}</p></div>`;
document.getElementById('start-form').onsubmit=e=>{e.preventDefault();const code=document.getElementById('code').value.trim().toUpperCase();if(!DATA.schedule[code]){document.getElementById('start-error').textContent=T('编号不存在，请核对邀请人的分配码。','Unknown code; check your assigned code.');return;}let saved=null;try{saved=JSON.parse(localStorage.getItem(DATA.version+'-'+code));}catch(e){}state=saved&&saved.version===DATA.version?saved:{version:DATA.version,assignment_code:code,stage:code[0]==='P'?'pilot':'formal',consent:true,adult:true,english_reading:true,instructions_language:lang,experience:document.getElementById('experience').value,prior_exposure:document.getElementById('familiar').value,started_at:new Date().toISOString(),quote_consent:false,responses:DATA.schedule[code].map((t,i)=>({...t,position:i+1,answers:{},both_poor:'unanswered',comment:'',active_seconds:0}))};state.instructions_language=lang;persist();index=0;render();};}
function world(id,label){const w=DATA.artifacts[id];return `<article class="card world"><div class="label">${label}</div>${w.sections.map(s=>`<h3>${esc(T(s.zh,s.en))}</h3><ul class="evidence" lang="en">${s.rows.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</article>`;}
function render(){enteredAt=0;if(index<0){intro();return;}if(index>=4){finish();return;}const r=state.responses[index];const pair=DATA.pairs[r.pair_id];app.innerHTML=`<div class="toolbar"><div><div class="kicker">${T('匿名设计比较','BLIND DESIGN COMPARISON')} · ${index+1} / 4</div><h1>${T('同一个要求，两份设计','One request, two designs')}</h1></div><span class="spacer"></span><span class="muted">${esc(state.assignment_code)}</span></div><div class="progress"><span style="width:${index/4*100}%"></span></div><section class="card"><h2>${T('共同生成要求','Common generation request')}</h2><p class="prompt" lang="en">${esc(pair.prompt)}</p></section><p class="muted">${T('阅读两份材料后评分。只依据当前展示；无需猜测来源。小屏幕上 A 在前、B 在后。','Read both designs before rating. Use only the evidence shown; do not guess the source. On small screens A appears before B.')}</p><div class="duel">${world(r.left,'A')}${world(r.right,'B')}</div><form id="rating-form" class="card"><h2>${T('你的判断','Your judgments')}</h2>${QUESTIONS.map(q=>`<div class="question"><p>${esc(T(q[1],q[2]))} · ${esc(T(q[3],q[4]))}</p><div class="choices">${OPTIONS.map(o=>`<label class="choice"><input type="radio" name="${q[0]}" value="${o[0]}" ${r.answers[q[0]]===o[0]?'checked':''} required><span>${esc(T(o[1],o[2]))}</span></label>`).join('')}</div></div>`).join('')}<div class="question"><p>${T('两份材料是否都不足以让你形成一个可信世界的印象？（可选）','Do both designs fall short of a believable world? (optional)')}</p><select name="both_poor"><option value="unanswered">${T('不回答','No answer')}</option><option value="yes">${T('是','Yes')}</option><option value="no">${T('否','No')}</option><option value="unable">${T('无法判断','Unable to judge')}</option></select></div><label class="block">${T('可选：哪一个具体细节最影响你的判断？可用中文或英文，不填个人信息。','Optional: Which specific detail most influenced your judgment? Chinese or English is welcome. Do not include personal information.')}<textarea name="comment" maxlength="2000">${esc(r.comment)}</textarea></label><p id="rating-error" class="error" role="alert"></p><div class="toolbar"><button type="button" class="secondary" id="back" ${index===0?'disabled':''}>${T('上一组','Previous')}</button><span class="spacer"></span><button type="submit">${index===3?T('检查并下载答卷','Review and download'):T('保存并继续','Save and continue')}</button></div></form><p class="muted">${T('所有评分都可选择“材料不足”。草稿只保存在本机。','Every rating offers “Insufficient evidence”. Drafts remain on this device.')}</p><button id="withdraw" class="secondary noprint">${T('退出并删除本机草稿','Leave and delete local draft')}</button>`;
const form=document.getElementById('rating-form');form.elements.both_poor.value=r.both_poor;form.oninput=()=>{for(const q of QUESTIONS)r.answers[q[0]]=form.elements[q[0]].value||undefined;r.comment=form.elements.comment.value;r.both_poor=form.elements.both_poor.value;persist();};form.onsubmit=e=>{e.preventDefault();if(!QUESTIONS.every(q=>OPTIONS.some(o=>o[0]===r.answers[q[0]]))){document.getElementById('rating-error').textContent=T('请完成各项判断；无法判断时选择“材料不足”。','Complete each judgment or choose “Insufficient evidence”.');return;}elapsed();index++;render();window.scrollTo(0,0);};document.getElementById('back').onclick=()=>{elapsed();index--;render();window.scrollTo(0,0);};document.getElementById('withdraw').onclick=withdraw;enteredAt=document.hidden?0:Date.now();}
function withdraw(){if(confirm(T('删除本机草稿并退出？已经下载或交回的文件不会被删除。','Delete the local draft and leave? Previously downloaded or returned files will remain.'))){if(state)try{localStorage.removeItem(DATA.version+'-'+state.assignment_code);}catch(e){}state=null;intro();window.scrollTo(0,0);}}
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function exportData(){state.completed_at=new Date().toISOString();persist();download('world_study_'+state.assignment_code+'.json',JSON.stringify(state,null,2),'application/json');document.getElementById('download-status').textContent=T('答卷已生成。请将下载的 JSON 文件交给邀请人；本页面没有自动上传。','Response generated. Return the downloaded JSON file to your recruiter; this page has not uploaded it.');}
function finish(){app.innerHTML=`<div class="intro"><div class="kicker">${T('完成 4 / 4','COMPLETED 4 / 4')}</div><h1>${T('感谢你的判断','Thank you for your judgments')}</h1><div class="card"><p>${T('答卷尚未自动交回。请下载文件，再按邀请人的方式发送。你仍可返回修改答案。','Your response has not been automatically returned. Download the file and send it as instructed by your recruiter. You may still go back to edit.')}</p><label class="block"><input type="checkbox" id="quotes" ${state.quote_consent?'checked':''}>${T('我另行同意在去除身份信息后引用我的可选评论。不勾选也可正常提交评分。','I separately consent to de-identified quotation of my optional comments. This is not required to contribute ratings.')}</label><div class="toolbar"><button id="download">${T('下载答卷 JSON','Download response JSON')}</button><button class="secondary" id="edit">${T('返回检查','Review answers')}</button></div><p id="download-status" role="status"></p><p class="muted">${T('如需撤回，请保留分配码：','Keep this assignment code for withdrawal requests: ')}<strong>${esc(state.assignment_code)}</strong></p></div><button class="secondary" id="withdraw">${T('删除本机草稿','Delete local draft')}</button></div>`;document.getElementById('quotes').onchange=e=>{state.quote_consent=e.target.checked;persist();};document.getElementById('download').onclick=exportData;document.getElementById('edit').onclick=()=>{index=3;render();};document.getElementById('withdraw').onclick=withdraw;}
document.getElementById('language').onchange=e=>{elapsed();lang=e.target.value;document.documentElement.lang=lang==='zh'?'zh-CN':'en';if(state){state.instructions_language=lang;persist();}render();};
window.addEventListener('beforeunload',()=>elapsed());intro();
</script></html>
