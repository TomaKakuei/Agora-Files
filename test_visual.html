<!DOCTYPE html>
<html>
<head>
    <title>Visual Regression Test</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #222; color: #fff; font-family: sans-serif; }
        .map-container {
            width: 800px;
            height: 600px;
            overflow: hidden;
            border: 2px solid #555;
            position: relative;
        }
        .map-img {
            width: 100%;
            height: auto;
        }
        .agent-container {
            position: absolute;
            width: 64px;
            height: 64px;
            overflow: hidden;
        }
        .agent-img {
            /* The atlas is typically a grid, we'll just show the whole thing scaled or clipped */
            width: 512px;
            height: auto;
        }
        .agent-preview {
            display: inline-block;
            margin: 10px;
            border: 1px solid #777;
            background-color: #333;
            text-align: center;
        }
        .agent-preview img {
            max-width: 128px;
            max-height: 128px;
        }
    </style>
</head>
<body>
    <h2>Visual Regression Test - New Batch</h2>
    <p>Map and Agents generated with room_part_compositor & flux_local_service</p>
    
    <h3>Map Preview (room_part_compositor)</h3>
    <div class="map-container">
        <!-- Load the new map directly -->
        <img class="map-img" src="frontend/assets/generated/world_asset_sets/guild_replaceable_full_20260530_221703/guild_map_source.png" alt="Guild Map">
    </div>

    <h3>Agent Previews (FLUX)</h3>
    <div>
        <div class="agent-preview">
            <div>guild_001</div>
            <img src="frontend/assets/generated/guild_001/guild_replaceable_full_20260530_221703/agent_atlas.png" alt="Guild 001">
        </div>
        <div class="agent-preview">
            <div>guild_002</div>
            <img src="frontend/assets/generated/guild_002/guild_replaceable_full_20260530_221703/agent_atlas.png" alt="Guild 002">
        </div>
        <div class="agent-preview">
            <div>guild_003</div>
            <img src="frontend/assets/generated/guild_003/guild_replaceable_full_20260530_221703/agent_atlas.png" alt="Guild 003">
        </div>
        <div class="agent-preview">
            <div>guild_004</div>
            <img src="frontend/assets/generated/guild_004/guild_replaceable_full_20260530_221703/agent_atlas.png" alt="Guild 004">
        </div>
    </div>
</body>
</html>
